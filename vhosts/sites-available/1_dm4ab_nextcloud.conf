<VirtualHost *:80>
  DocumentRoot /var/www/nextcloud/
  ServerName  cloud.dm4ab.de
  ProxyFCGIBackendType FPM

    ## need this for ACME challenfge so the challenge knows where to write to, always same dir, for all vhosts
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    # more for ACME
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]    
    ## end ACME

  <FilesMatch \.php$>
    SetHandler "proxy:fcgi://php81:9000/"
  </FilesMatch>

  <Directory /var/www/nextcloud/>
    Require all granted
    AllowOverride All
    Options FollowSymLinks MultiViews

    <IfModule mod_dav.c>
      Dav off
    </IfModule>
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/cloud-dm4ab-error.log
  CustomLog ${APACHE_LOG_DIR}/cloud-dm4ab-access.log combined

</VirtualHost>


<VirtualHost *:443>
    ServerName cloud.dm4ab.de 
    DocumentRoot /var/www/nextcloud

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php81:9000/"
    </FilesMatch>

    <Directory /var/www/nextcloud>
        AllowOverride All
        Require all granted
    </Directory>

    # TLS
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/cloud.dm4ab.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cloud.dm4ab.de/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/cloud-dm4ab-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/cloud-dm4ab-ssl-access.log combined

</VirtualHost>
