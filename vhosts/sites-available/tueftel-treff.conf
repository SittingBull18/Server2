
## watch out for multiple uses of domain and ssl keys, 
## port 80, 443

<VirtualHost *:80>
    ServerName tueftel-treff.de
    ServerAlias www.tueftel-treff.de
    DocumentRoot /var/www/tueftel-treff

    ## need this for ACME challenfge so the challenge knows where to write to, always same dir, for all vhosts
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    # more for ACME
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]    
    ## end ACME

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php81:9000/"
    </FilesMatch>

    <Directory /var/www/tueftel-treff>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/tueftel-treff-error.log
    CustomLog ${APACHE_LOG_DIR}/tueftel-treff.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName tueftel-treff.de
    ServerAlias www.tueftel-treff.de
    DocumentRoot /var/www/tueftel-treff

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php81:9000/"
    </FilesMatch>

    <Directory /var/www/tueftel-treff>
        AllowOverride All
        Require all granted
    </Directory>

    # TLS
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tueftel-treff.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tueftel-treff.de/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/tueftel-treff-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/tueftel-treff-ssl-access.log combined
</VirtualHost>
