
## watch out for multiple uses of domain and ssl keys, 
## port 80, 443

<VirtualHost *:80>
    ServerName amateur-radio.site 
    ServerAlias www.amateur-radio.site 
    DocumentRoot /var/www/radiosite

    ## need this for ACME challenfge so the challenge knows where to write to, always same dir, for all vhosts
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    # more for ACME
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]    
    ## end ACME

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php81:9000/"
    </FilesMatch>

    <Directory /var/www/radiosite>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/radiossite-error.log
    CustomLog ${APACHE_LOG_DIR}/radiosite-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName amateur-radio.site
    ServerAlias www.amateur-radio.site
    DocumentRoot /var/www/radiosite

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php81:9000/"
    </FilesMatch>

    <Directory /var/www/radiosite>
        AllowOverride All
        Require all granted
    </Directory>

    # TLS
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/amateur-radio.site/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/amateur-radio.site/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/radiosite-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/radiosite-ssl-access.log combined

</VirtualHost>


# ham-radio.site www.ham-radio.site
<VirtualHost *:80>
    ServerName ham-radio.site
    ServerAlias www.ham-radio.site
