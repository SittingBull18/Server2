services:
  apache:
    build: ./apache
    image: multi-apache
    container_name: apache
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./sites:/var/www:ro
      - ./vhosts:/etc/apache2/sites-enabled:ro
      # - ./apache/apache.conf:/etc/apache2/apache2.conf:ro
    networks:
      - web

networks:
  web:
    driver: bridge
